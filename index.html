// แปลง Unicode normalize
function normalizeStr(str) {
    return str ? str.normalize('NFC').trim() : '';
}

// Map โครงสร้างข้อมูล
const grammarData = rawJSONData.map(item => {
    let colorClass = "cat-ambiguous";
    
    if (item.is_ambiguous) colorClass = "cat-ambiguous";
    else if (item.category.includes("วิภัตติ")) colorClass = "cat-vibhatti";
    else if (item.category.includes("อาขยาต") || item.category.includes("ธาตุ")) colorClass = "cat-akhyata";
    else if (item.category.includes("กิตก์")) colorClass = "cat-kit";
    else if (item.category.includes("นิบาต")) colorClass = "cat-nipata";
    else if (item.category.includes("คุณนาม") || item.category.includes("สัพพนาม")) colorClass = "cat-adjective";
    else if (item.category.includes("ราชาศัพท์")) colorClass = "cat-honor";

    const fullMeaning = item.pali_equivalent && item.pali_equivalent !== "-"
        ? `<span style="color:#2563eb; font-weight:600;">[บาลี: ${item.pali_equivalent}]</span><br>${item.thai_meaning}` 
        : item.thai_meaning;

    return {
        word: normalizeStr(item.word),
        category: item.category,
        meaning: fullMeaning,
        class: colorClass
    };
});

const tableBody = document.getElementById('suffixTableBody');
const dataMap = {};

// เรียงลำดับจากคำยาวไปสั้น เพื่อให้ Match คำยาวก่อนเสมอ (Strict Longest Match)
const sortedGrammar = [...grammarData].sort((a, b) => b.word.length - a.word.length);

sortedGrammar.forEach((item, index) => {
    dataMap[item.word] = { ...item, id: encodeURIComponent(item.word + index) }; 
    
    const row = document.createElement('tr');
    row.id = `row-${dataMap[item.word].id}`;
    row.innerHTML = `
        <td style="font-size: 17px; font-weight: 500;">
            <span class="${item.class}" style="padding: 4px 8px; border-radius: 6px;">${item.word}</span>
        </td>
        <td style="color: #64748b; font-size: 14px;">${item.category}</td>
        <td style="line-height: 1.5;">${item.meaning}</td>
    `;
    tableBody.appendChild(row);
});

function escapeRegExp(string) {
    return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

/**
 * 💡 MYANMAR ADVANCED TOKENIZER ENGINE
 * แบ่งประโยคพม่าออกเป็นคำและพยางค์อย่างถูกต้องตามมาตรฐาน Unicode โดยไม่ทำให้ตัวสะกดหลุด
 */
function tokenizeAndHighlight(text) {
    let normalizedInput = normalizeStr(text);
    if (!normalizedInput) return "<span style='color:#94a3b8;'>โปรดระบุประโยคบาลี-พม่า</span>";

    let resultHTML = "";
    let currentIndex = 0;

    while (currentIndex < normalizedInput.length) {
        let matched = false;

        // ค้นหาแบบ Longest-Match-First ในตำแหน่งปัจจุบัน
        for (let item of sortedGrammar) {
            let targetWord = item.word;
            if (normalizedInput.startsWith(targetWord, currentIndex)) {
                // ตรวจสอบว่าพยางค์ถัดไปถูกตัดกึ่งกลางวรรณยุกต์หรือไม่
                let nextCharIndex = currentIndex + targetWord.length;
                let nextChar = normalizedInput.charAt(nextCharIndex);
                
                // ถ้ารหัสถัดไปเป็นสระ/ตัวสะกดตามหลัง (เช่น ်, ိ, ု, း ฯลฯ) แสดงว่าตัดกลางพยางค์ ให้ข้ามคำนี้ไป
                if (nextChar && /[\u102B-\u103E\u1056-\u1059\u103A]/.test(nextChar)) {
                    continue;
                }

                // เจอคำสมบูรณ์ Highlight ได้
                let matchedObj = dataMap[targetWord];
                resultHTML += `<span class="highlight ${matchedObj.class}" onclick="scrollToRow('${matchedObj.id}')">${targetWord}</span>`;
                currentIndex += targetWord.length;
                matched = true;
                break;
            }
        }

        // ถ้าไม่มีคำไหน Match ในตำแหน่งนี้ ให้ขยับทีละ 1 ตัวอักษร
        if (!matched) {
            resultHTML += normalizedInput.charAt(currentIndex);
            currentIndex++;
        }
    }

    return resultHTML;
}

function processSentence() {
    let rawInput = document.getElementById('myanmarInput').value;
    const previewArea = document.getElementById('previewArea');
    
    previewArea.innerHTML = tokenizeAndHighlight(rawInput);
    document.querySelectorAll('tr').forEach(tr => tr.classList.remove('active-row'));
}

function scrollToRow(id) {
    const targetRow = document.getElementById(`row-${id}`);
    if (targetRow) {
        document.querySelectorAll('tr').forEach(tr => tr.classList.remove('active-row'));
        targetRow.scrollIntoView({ behavior: 'smooth', block: 'center' });
        targetRow.classList.add('active-row');
    }
}

document.getElementById('myanmarInput').addEventListener('input', processSentence);
processSentence();
