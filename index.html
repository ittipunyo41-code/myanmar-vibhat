        * { box-sizing: border-box; }
        body { 
            font-family: 'Sarabun', 'Padauk', 'Noto Sans Myanmar', sans-serif;

            color: #334155;
            margin: 0;
        }
        .container { 
            max-width: 900px;

            box-shadow: 0 4px 24px rgba(0,0,0,0.04); 
        }
        
        h2 { font-weight: 600; color: #0f172a; margin-top: 0; margin-bottom: 20px; font-size: 24px; }
        h3 { font-weight: 600; color: #334155; margin-top: 30px; font-size: 18px; }

        /* ป้ายบอกหมวดหมู่ */
        .legend { display: flex; gap: 10px; margin-bottom: 25px; flex-wrap: wrap; }
        .legend span { 
            padding: 6px 12px; 
            border-radius: 20px; 
            font-size: 13px; 
            font-weight: 500;
        }

        /* ช่องรับข้อมูล */
        input[type="text"] { 
            width: 100%; 
            padding: 14px 18px; 
            font-size: 18px; 
            margin-bottom: 20px; 
            border: 1px solid #e2e8f0; 
            border-radius: 10px; 
            transition: all 0.2s;
            outline: none;
            background: #f8fafc;
        }
        input[type="text"]:focus {
            border-color: #93c5fd;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(147, 197, 253, 0.3);
        }
        
        /* ส่วนแสดงผล Highlight */
        .input-preview { 
            font-size: 22px; 
            line-height: 2; 
            margin: 10px 0 20px 0; 
            padding: 20px; 
            background: #ffffff; 
            border-radius: 10px; 
            border: 1px solid #e2e8f0; 
            word-break: break-all; 
            min-height: 80px;
        }
        .highlight { 
            font-weight: 600; 
            cursor: pointer; 
            padding: 4px 8px; 
            border-radius: 6px; 
            transition: all 0.2s ease; 
        }
        .highlight:hover { filter: brightness(0.95); transform: translateY(-1px); display: inline-block; }
        
        /* ตาราง */
        .table-container { 
            max-height: 500px; 
            overflow-y: auto; 
            border: 1px solid #e2e8f0;
            border-radius: 10px;
        }
        table { width: 100%; border-collapse: collapse; font-size: 15px; text-align: left; }
        th, td { padding: 14px 16px; border-bottom: 1px solid #f1f5f9; }
        th { 
            background-color: #f8fafc; 
            color: #475569; 
            font-weight: 600; 
            position: sticky; 
            top: 0; 
            z-index: 10;
            border-bottom: 2px solid #e2e8f0;
        }
        tr:last-child td { border-bottom: none; }
        tr { transition: background-color 0.2s; }
        tr:hover { background-color: #f8fafc; }
        
        /* หมวดหมู่สีพาสเทล */
        .cat-vibhatti { background-color: #fef08a; color: #854d0e; } /* เหลือง */
        .cat-akhyata { background-color: #bbf7d0; color: #166534; }  /* เขียว */
        .cat-kit { background-color: #bfdbfe; color: #1e3a8a; }      /* ฟ้า */
        .cat-honor { background-color: #e9d5ff; color: #6b21a8; }    /* ม่วง */
        .cat-nipata { background-color: #ffedd5; color: #9a3412; }   /* ส้ม */
        .cat-adjective { background-color: #fbcfe8; color: #9d174d; } /* ชมพู */
        .cat-number { background-color: #fed7aa; color: #c2410c; }    /* ส้มอิฐ - สังขยา/ตัวเลข */
        .cat-ambiguous { background-color: #e2e8f0; color: #334155; } /* เทา */

        .active-row { 
            background-color: #eff6ff !important; 
            position: relative;
        }

            content: '';

function normalizeStr(str) {
    return str ? str.normalize('NFC').trim() : '';
}

// Map โครงสร้างข้อมูลและจำแนกสี
const grammarData = rawJSONData.map(item => {
    let colorClass = "cat-ambiguous";
    
    if (item.is_ambiguous) colorClass = "cat-ambiguous";
    else if (item.category.includes("สังขยา") || item.category.includes("คำประสม")) colorClass = "cat-number";
    else if (item.category.includes("วิภัตติ")) colorClass = "cat-vibhatti";
    else if (item.category.includes("อาขยาต") || item.category.includes("ธาตุ") || item.category.includes("นามนาม")) colorClass = "cat-akhyata";
    else if (item.category.includes("กิตก์")) colorClass = "cat-kit";
    else if (item.category.includes("นิบาต")) colorClass = "cat-nipata";
    else if (item.category.includes("คุณนาม") || item.category.includes("สัพพนาม")) colorClass = "cat-adjective";
    else if (item.category.includes("ราชาศัพท์")) colorClass = "cat-honor";

    const fullMeaning = item.pali_equivalent && item.pali_equivalent !== "-"
        ? `<span style="color:#2563eb; font-weight:600;">[บาลี: ${item.pali_equivalent}]</span><br>${item.thai_meaning}` 
        : item.thai_meaning;

    return {
        word: normalizeStr(item.word),
        category: item.category,
        meaning: fullMeaning,
        class: colorClass
    };
});

const tableBody = document.getElementById('suffixTableBody');
const dataMap = {};

// เรียงลำดับจาก "คำยาวที่สุดไปสั้นที่สุด" เพื่อให้แมตช์คำประสมก่อนเสมอ
const sortedGrammar = [...grammarData].sort((a, b) => b.word.length - a.word.length);

sortedGrammar.forEach((item, index) => {
    dataMap[item.word] = { ...item, id: encodeURIComponent(item.word + index) }; 
    
    const row = document.createElement('tr');
    row.id = `row-${dataMap[item.word].id}`;
    row.innerHTML = `
        <td style="font-size: 17px; font-weight: 500;">
            <span class="${item.class}" style="padding: 4px 8px; border-radius: 6px;">${item.word}</span>
        </td>
        <td style="color: #64748b; font-size: 14px;">${item.category}</td>
        <td style="line-height: 1.5;">${item.meaning}</td>
    `;
    tableBody.appendChild(row);
});

/**
 * 💡 PALI-MYANMAR STRICT LONGEST-MATCH TOKENIZER
 * ตัดคำบาลี-พม่าอย่างถูกต้อง โดยไม่ตัดกลางตัวซ้อน Virama (္) และรองรับคำประสมสมบูรณ์แบบ
 */
function tokenizeAndHighlight(text) {
    let normalizedInput = normalizeStr(text);
    if (!normalizedInput) return "<span style='color:#94a3b8;'>โปรดระบุประโยคบาลี-พม่า</span>";

    let resultHTML = "";
    let currentIndex = 0;

    while (currentIndex < normalizedInput.length) {
        let matched = false;

        // ค้นหาแบบ Strict Longest-Match First
        for (let item of sortedGrammar) {
            let targetWord = item.word;
            if (normalizedInput.startsWith(targetWord, currentIndex)) {
                let nextCharIndex = currentIndex + targetWord.length;
                let nextChar = normalizedInput.charAt(nextCharIndex);
                
                // ตรวจสอบตัวอักษรตามหลัง: ถ้าเป็นตัวพินทุสังโยค (္) หรือสระล่าง/สระบนที่ผูกกับตัวท้าย
                // จะไม่ยอมให้ตัดกลางคำ ยกเว้นเป็นคำที่แมตช์เต็มรูปในคลัง
                if (nextChar && /[\u1039\u103A\u102B-\u103E]/.test(nextChar) && targetWord.endsWith("္")) {
                    continue;
                }

                // เจอคำประสมสมบูรณ์ Highlight ได้ทันที
                let matchedObj = dataMap[targetWord];
                resultHTML += `<span class="highlight ${matchedObj.class}" onclick="scrollToRow('${matchedObj.id}')">${targetWord}</span>`;
                currentIndex += targetWord.length;
                matched = true;
                break;
            }
        }

        if (!matched) {
            resultHTML += normalizedInput.charAt(currentIndex);
            currentIndex++;
        }
    }

    return resultHTML;
}

function processSentence() {
    let rawInput = document.getElementById('myanmarInput').value;
    const previewArea = document.getElementById('previewArea');
    
    previewArea.innerHTML = tokenizeAndHighlight(rawInput);
    document.querySelectorAll('tr').forEach(tr => tr.classList.remove('active-row'));
}

function scrollToRow(id) {
    const targetRow = document.getElementById(`row-${id}`);
    if (targetRow) {
        document.querySelectorAll('tr').forEach(tr => tr.classList.remove('active-row'));
        targetRow.scrollIntoView({ behavior: 'smooth', block: 'center' });
        targetRow.classList.add('active-row');
    }
}

document.getElementById('myanmarInput').addEventListener('input', processSentence);
processSentence();
